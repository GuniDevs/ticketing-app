[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-api"
version = "0.1.0"
description = "A small helpdesk ticketing API: users, tickets, comments and reports"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
